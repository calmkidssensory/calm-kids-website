<!--
  ============================================================
  HOW TO USE THIS FILE
  ============================================================
  1. The Etsy shop link is still a placeholder (href="#") — swap it
     in once the real shop URL is confirmed (marked <!-- EDIT -- ).
  2. Avatar currently uses the brand logo (../images/logo.png).
     Swap for a real photo by dropping a file in website/card/ and
     pointing the <img> at it (square image, 300x300px+ works best).
  3. Push this to the calm-kids-website repo (or wherever this
     site is hosted) so it goes live at:
         https://calmkidssensory.com/card/
     (or your own domain's equivalent path).
  4. To hand it to someone in person, phone-only (no NFC hardware):
       - Tap "Share" — opens your phone's native share sheet
         (AirDrop / Nearby Share / Messages) so you can beam the
         link directly to a nearby phone.
       - Or tap "QR" and let them scan it with their camera app.
       - If you're both on iPhone, iOS's built-in NameDrop
         (Settings > AirDrop) also works by holding phones near
         each other — separate from this page, shares your native
         Contacts entry instead.
     (A literal NFC "tap" needs a physical tag on one side — a
     phone can't emulate one in software — so this skips that
     entirely rather than requiring a sticker.)
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-1: #16241f;
        --bg-2: #0b1512;
        --card-line: rgba(255,255,255,0.08);
        --text-light: #f5f2ec;
        --text-muted: rgba(245,242,236,0.58);
        --pill-bg: rgba(255,255,255,0.06);
        --pill-dot: #e8a268;
        --gold-1: #f6c89f;
        --gold-2: #e8a268;
        --action-bg: rgba(255,255,255,0.05);
        --action-border: rgba(255,255,255,0.10);
        --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        min-height: 100vh;
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: var(--text-light);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 48px 20px 64px;
        background: radial-gradient(circle at 50% 0%, var(--bg-1) 0%, var(--bg-2) 75%);
    }

    .card {
        width: 100%;
        max-width: 380px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .avatar {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        overflow: hidden;
        background: rgba(255,255,255,0.06);
        border: 1px solid var(--card-line);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
    }

    .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    h1 {
        font-family: 'Playfair Display', serif;
        font-weight: 600;
        font-size: 26px;
        letter-spacing: -0.01em;
        margin-bottom: 8px;
    }

    .role {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--gold-2);
        margin-bottom: 28px;
    }

    /* Save my contact — primary CTA */
    .btn-save {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 17px 20px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
        color: #2a1c0f;
        font-weight: 700;
        font-size: 15px;
        text-decoration: none;
        border: none;
        box-shadow: 0 10px 26px rgba(232,162,104,0.28);
        transition: var(--transition);
        margin-bottom: 14px;
        cursor: pointer;
    }

    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(232,162,104,0.35); }
    .btn-save svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* Share / QR row */
    .row-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        width: 100%;
        margin-bottom: 14px;
    }

    .action-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px 12px;
        border-radius: 14px;
        background: var(--action-bg);
        border: 1px solid var(--action-border);
        color: var(--text-light);
        font-size: 13.5px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        transition: var(--transition);
    }

    .action-btn:hover { border-color: rgba(255,255,255,0.22); transform: translateY(-1px); }
    .action-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* WhatsApp / Call / Email row */
    .row-3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
        width: 100%;
        margin-bottom: 12px;
    }

    .row-3 .action-btn { flex-direction: column; padding: 14px 8px; font-size: 12px; }
    .row-3 .action-btn svg { width: 18px; height: 18px; }

    .toast {
        font-size: 12px;
        color: var(--text-muted);
        min-height: 16px;
        margin-bottom: 8px;
        opacity: 0;
        transition: opacity 0.2s;
    }
    .toast.show { opacity: 1; }

    /* QR panel */
    .qr-panel {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        background: var(--action-bg);
        border: 1px solid var(--action-border);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 24px;
        width: 100%;
    }
    .qr-panel.show { display: flex; }
    .qr-panel img { width: 180px; height: 180px; border-radius: 8px; background: #fff; padding: 8px; }
    .qr-panel span { font-size: 11px; color: var(--text-muted); word-break: break-all; }

    /* Follow Along */
    .follow-label {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin: 10px 0 14px;
    }

    .follow-list {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 32px;
    }

    .follow-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 13px 16px;
        border-radius: 14px;
        background: var(--action-bg);
        border: 1px solid var(--action-border);
        text-decoration: none;
        color: var(--text-light);
        transition: var(--transition);
    }

    .follow-item:hover { border-color: rgba(255,255,255,0.22); transform: translateY(-1px); }

    .follow-icon {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .follow-icon svg { width: 17px; height: 17px; fill: #fff; }

    .icon-youtube { background: #FF0000; }
    .icon-instagram { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
    .icon-tiktok { background: #000000; }
    .icon-pinterest { background: #E60023; }
    .icon-etsy { background: #F1641E; }
    .icon-amazon { background: #131A22; }
    .icon-site { background: #ffffff; padding: 6px; }
    .icon-site img { width: 100%; height: 100%; object-fit: contain; }

    .follow-text { flex: 1; text-align: left; }
    .follow-platform { font-size: 13.5px; font-weight: 600; margin-bottom: 1px; }
    .follow-handle { font-size: 12px; color: var(--text-muted); }

    .follow-arrow { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }

    footer {
        font-size: 12px;
        color: var(--text-muted);
        letter-spacing: 0.02em;
        font-style: italic;
        font-family: 'Playfair Display', serif;
    }
</style>

</div>

<script>
(function () {
    // ---- vCard fields (kept in one place for easy editing) ----
    var contact = {
        firstName: "Ash Avi",
        lastName: "Khalili",
        org: "Calm Kids Sensory",
        phone: "+15167246297",
        whatsapp: "+972584568456",
        email: "explore@calmkidssensory.com",
        website: "https://calmkidssensory.com"
    };

    var vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "N:" + contact.lastName + ";" + contact.firstName + ";;;",
        "FN:" + contact.firstName + " " + contact.lastName,
        "ORG:" + contact.org,
        "TEL;TYPE=CELL:" + contact.phone,
        "TEL;TYPE=WORK:" + contact.whatsapp,
        "EMAIL:" + contact.email,
        "URL:" + contact.website,
        "NOTE:Second number is WhatsApp",
        "END:VCARD"
    ].join("\r\n");

    var saveBtn = document.getElementById("saveContactBtn");
    saveBtn.addEventListener("click", function (e) {
        e.preventDefault();
        var blob = new Blob([vcard], { type: "text/vcard" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = contact.firstName + "_" + contact.lastName + ".vcf";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    });

    var toast = document.getElementById("toast");
    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(function () { toast.classList.remove("show"); }, 2200);
    }

    document.getElementById("shareBtn").addEventListener("click", function () {
        var url = window.location.href;
        if (navigator.share) {
            navigator.share({ title: document.title, url: url }).catch(function () {});
        } else if (navigator.clipboard) {
            navigator.clipboard.writeText(url).then(function () { showToast("Link copied"); });
        } else {
            showToast(url);
        }
    });

    var qrPanel = document.getElementById("qrPanel");
    var qrImg = document.getElementById("qrImg");
    var qrUrlLabel = document.getElementById("qrUrl");
    var qrLoaded = false;
    document.getElementById("qrBtn").addEventListener("click", function () {
        var url = window.location.href;
        if (!qrLoaded) {
            qrImg.src = "https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=" + encodeURIComponent(url);
            qrUrlLabel.textContent = url;
            qrLoaded = true;
        }
        qrPanel.classList.toggle("show");
    });
})();
</script>
